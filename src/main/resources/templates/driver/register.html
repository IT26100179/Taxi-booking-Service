<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: html_head('Register Driver')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container py-5" style="max-width: 760px;">
    <div class="mb-4">
        <h2 class="fw-bold text-white mb-1"><i class="fa-solid fa-user-plus text-warning me-2"></i> Register Driver</h2>
        <p class="text-light mb-0">New drivers start as <strong>OFFLINE</strong> with a rating of <strong>0.0</strong>.</p>
    </div>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="post" th:action="@{/drivers/register}" class="card-custom p-4">
        <div class="row g-3">
            <div class="col-12">
                <label class="form-label text-light small">Full name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-light small">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-light small">Phone (10 digits)</label>
                <input type="text" name="phone" class="form-control" pattern="\d{10}"
                       title="Enter exactly 10 digits" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-light small">NIC</label>
                <input type="text" name="nic" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-light small">Licence number</label>
                <input type="text" name="licence" class="form-control" required>
            </div>
            <div class="col-md-6">
                <label class="form-label text-light small">Employment type</label>
                <select name="employmentType" class="form-select" required>
                    <option value="FULLTIME">FULLTIME (keeps 80% of fare)</option>
                    <option value="PARTTIME">PARTTIME (keeps 65% of fare)</option>
                </select>
            </div>
            <div class="col-md-6">
                <label class="form-label text-light small">Assigned vehicle</label>
                <select name="vehicleId" class="form-select" required>
                    <option th:each="v : ${vehicles}" th:value="${v.key}"
                            th:text="${v.key + ' (' + v.value + ')'}"></option>
                </select>
            </div>
            <div class="col-12">
                <label class="form-label text-light small">Password (min 4 characters)</label>
                <input type="password" name="password" class="form-control" minlength="4" required>
            </div>
        </div>
        <div class="d-flex gap-2 mt-4">
            <button type="submit" class="btn btn-warning-custom px-4">Register</button>
            <a th:href="@{/drivers}" class="btn btn-outline-custom">Cancel</a>
        </div>
    </form>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
