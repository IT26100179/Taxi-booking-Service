<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Passenger Login')}">
    <title>Passenger Login - Gamana</title>
</head>
<body class="bg-light">

<main class="d-flex align-items-center min-vh-100 py-4">
    <div class="container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-icon-circle">
                    <i class="bi bi-person-fill"></i>
                </div>
                <h2 class="fw-bold mb-1">Passenger Login</h2>
                <p class="text-muted small">Welcome back to Gamana Taxi</p>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/login}" th:object="${form}" method="post" class="needs-validation" novalidate id="loginForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="phone">Phone Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-phone"></i></span>
                        <input class="form-control" id="phone" name="phone" th:field="*{phone}"
                               placeholder="0771234567" required pattern="0[0-9]{9}">
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input class="form-control" id="password" name="password" th:field="*{password}"
                               type="password" required minlength="8" placeholder="••••••••">
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1" title="Show/Hide Password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="showPw">
                        <label class="form-check-label text-muted small" for="showPw">Show password</label>
                    </div>
                </div>

                <button class="btn btn-primary-custom w-100 py-2 mt-2" type="submit">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Log in as Passenger
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                <p class="mb-2">New here? <a th:href="@{/register}" class="fw-bold text-success text-decoration-none">Create a passenger account</a></p>
                <p class="mb-0">Drive with us? <a th:href="@{/driver/register}" class="fw-bold text-primary text-decoration-none">Register as Driver</a> &bull; <a th:href="@{/driver/login}" class="fw-bold text-dark text-decoration-none">Driver Login</a></p>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/validation.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
