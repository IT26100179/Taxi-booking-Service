<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="header(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - Gamana Taxi'">Gamana Taxi Platform</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin=""/>
    <!-- Custom CSS -->
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark py-3 shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand text-white" th:href="@{/}">
            <i class="bi bi-geo-alt-fill text-warning"></i>
            <span>Gamana</span>
            <span class="brand-badge ms-1" th:text="${session.role != null ? session.role : 'TAXI'}">TAXI</span>
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-3" th:if="${session.role != null}">
                <!-- Passenger Links -->
                <li class="nav-item" th:if="${session.role == 'PASSENGER' or session.passengerUserId != null}">
                    <a class="nav-link text-white-50" th:href="@{/passenger}">
                        <i class="bi bi-compass me-1"></i> Book Ride
                    </a>
                </li>
                <li class="nav-item" th:if="${session.role == 'PASSENGER' or session.passengerUserId != null}">
                    <a class="nav-link text-white-50" th:href="@{/passenger/history}">
                        <i class="bi bi-clock-history me-1"></i> Ride History
                    </a>
                </li>

                <!-- Driver Links -->
                <li class="nav-item" th:if="${session.role == 'DRIVER' or session.driverUserId != null}">
                    <a class="nav-link text-white-50" th:href="@{/driver}">
                        <i class="bi bi-speedometer2 me-1"></i> Driver Dashboard
                    </a>
                </li>

                <!-- Admin Links -->
                <li class="nav-item" th:if="${session.role == 'ADMIN' or session.adminUserId != null}">
                    <a class="nav-link text-white-50" th:href="@{/admin}">
                        <i class="bi bi-bar-chart-fill me-1"></i> Overview
                    </a>
                </li>
                <li class="nav-item" th:if="${session.role == 'ADMIN' or session.adminUserId != null}">
                    <a class="nav-link text-white-50" th:href="@{/admin/drivers}">
                        <i class="bi bi-people-fill me-1"></i> Drivers
                    </a>
                </li>
                <li class="nav-item" th:if="${session.role == 'ADMIN' or session.adminUserId != null}">
                    <a class="nav-link text-white-50" th:href="@{/admin/rides}">
                        <i class="bi bi-taxi-front me-1"></i> Rides
                    </a>
                </li>
                <li class="nav-item" th:if="${session.role == 'ADMIN' or session.adminUserId != null}">
                    <a class="nav-link text-white-50" th:href="@{/admin/rates}">
                        <i class="bi bi-tag-fill me-1"></i> Rates
                    </a>
                </li>
                <li class="nav-item" th:if="${session.role == 'ADMIN' or session.adminUserId != null}">
                    <a class="nav-link text-white-50" th:href="@{/admin/promos}">
                        <i class="bi bi-gift-fill me-1"></i> Promos
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3 ms-auto" th:if="${session.role != null or session.adminUserId != null or session.driverUserId != null or session.passengerUserId != null}">
                <div class="text-white small d-none d-sm-block text-end">
                    <div class="fw-bold" th:text="${session.adminUserName != null ? session.adminUserName : (session.userName != null ? session.userName : session.userId)}">User</div>
                    <span class="badge bg-secondary" th:text="${session.adminUserId != null ? 'ADMIN' : session.role}">Role</span>
                </div>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-light btn-sm px-3 rounded-pill">
                        <i class="bi bi-box-arrow-right me-1"></i> Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- Alerts Fragment -->
<div th:fragment="alerts" class="container mt-3">
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${error}">An error occurred</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${info}" class="alert alert-info alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-info-circle-fill me-2"></i>
        <span th:text="${info}">Information</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<footer th:fragment="footer">
    <div class="container text-center">
        <p class="mb-1 text-muted"><strong>Gamana</strong> &bull; True Taxi &amp; Cab Service Platform</p>
        <p class="small text-muted mb-0">Built with Java 17, Spring Boot 3 &amp; File-based persistence</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Leaflet Map JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
</footer>

</body>
</html>
