<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Promo Codes')}">
    <title>Promo Codes - Gamana</title>
</head>
<body class="bg-light">

<div th:replace="~{fragments/layout :: navbar}"></div>
<div th:replace="~{fragments/layout :: alerts}"></div>

<main class="container py-4">
    <div class="row g-4">
        <!-- Promos List -->
        <div class="col-lg-8">
            <div class="card card-custom p-4 h-100">
                <div class="mb-4">
                    <h3 class="fw-bold mb-1">Active Promo Codes</h3>
                    <p class="text-muted small mb-0">Discounts applicable to passenger bookings</p>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light small text-muted">
                            <tr>
                                <th>Code</th>
                                <th>Discount</th>
                                <th>Valid Until</th>
                                <th>Redemptions</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${promos == null or promos.isEmpty()}">
                                <td colspan="5" class="text-center text-muted py-4">No promo codes created yet</td>
                            </tr>
                            <tr th:each="p : ${promos}">
                                <td>
                                    <span class="badge bg-dark font-monospace fs-6 px-3 py-2 rounded-pill" th:text="${p.code}">UOC10</span>
                                </td>
                                <td>
                                    <strong class="text-success" th:text="${p.discountPct} + '% OFF'">10% OFF</strong>
                                </td>
                                <td class="small" th:text="${p.validTo}">2026-12-31</td>
                                <td>
                                    <span th:text="${p.usedCount}">0</span> / <span th:text="${p.usageLimit}">100</span> used
                                    <div class="progress mt-1" style="height: 6px;">
                                        <div class="progress-bar bg-success" role="progressbar"
                                             th:style="'width: ' + (${p.usageLimit > 0 ? (p.usedCount * 100.0 / p.usageLimit) : 0}) + '%;'"></div>
                                    </div>
                                </td>
                                <td>
                                    <span th:if="${p.valid}" class="badge bg-success-subtle text-success">ACTIVE</span>
                                    <span th:if="${!p.valid}" class="badge bg-secondary-subtle text-secondary">EXPIRED</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Create Promo Form -->
        <div class="col-lg-4">
            <div class="card card-custom p-4">
                <div class="mb-3">
                    <h5 class="fw-bold mb-1"><i class="bi bi-plus-circle text-primary me-1"></i> New Promo Code</h5>
                    <p class="text-muted small mb-0">Create marketing discounts</p>
                </div>

                <form th:action="@{/admin/promos}" th:object="${form}" method="post">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Promo Code</label>
                        <input class="form-control text-uppercase font-monospace fw-bold" name="code" th:field="*{code}"
                               placeholder="e.g. GAMANA20" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Discount Percentage (%)</label>
                        <div class="input-group">
                            <input type="number" min="1" max="99" class="form-control" name="discountPct" th:field="*{discountPct}"
                                   placeholder="15" required>
                            <span class="input-group-text bg-light">%</span>
                        </div>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('discountPct')}" th:errors="*{discountPct}"></div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small fw-semibold">Valid Until</label>
                        <input type="date" class="form-control" name="validTo" th:field="*{validTo}" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('validTo')}" th:errors="*{validTo}"></div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold">Usage Limit (Max claims)</label>
                        <input type="number" min="1" class="form-control" name="usageLimit" th:field="*{usageLimit}"
                               placeholder="100" required>
                        <div class="text-danger small mt-1" th:if="${#fields.hasErrors('usageLimit')}" th:errors="*{usageLimit}"></div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 rounded-pill py-2">
                        <i class="bi bi-tag-fill me-1"></i> Create Promo Code
                    </button>
                </form>
            </div>
        </div>
    </div>
</main>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
