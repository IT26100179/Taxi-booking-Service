<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: header('Passenger Registration')}">
    <title>Passenger Sign Up - Gamana</title>
</head>
<body class="bg-light">

<main class="d-flex align-items-center min-vh-100 py-4">
    <div class="container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="auth-icon-circle">
                    <i class="bi bi-person-plus-fill"></i>
                </div>
                <h2 class="fw-bold mb-1">Create Account</h2>
                <p class="text-muted small">Sign up for instant ride booking</p>
            </div>

            <div th:replace="~{fragments/layout :: alerts}"></div>

            <form th:action="@{/register}" th:object="${form}" method="post" class="needs-validation" novalidate id="registerForm">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="fullName">Full Name</label>
                    <input class="form-control" id="fullName" name="fullName" th:field="*{fullName}"
                           placeholder="Nadeesha Perera" required>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="phone">Phone Number</label>
                    <input class="form-control" id="phone" name="phone" th:field="*{phone}"
                           placeholder="0771234567" required pattern="0[0-9]{9}">
                    <div class="form-text small text-muted">Must be 10 digits starting with 0.</div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="email">Email Address <span class="text-muted fw-normal">(Optional)</span></label>
                    <input class="form-control" id="email" name="email" th:field="*{email}"
                           type="email" placeholder="nade@mail.com">
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="password">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input class="form-control" id="password" name="password" th:field="*{password}"
                               type="password" required minlength="8" placeholder="At least 8 characters">
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1" title="Show/Hide Password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="text-danger small mt-1" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold" for="confirmPassword">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                        <input class="form-control" id="confirmPassword" name="confirmPassword" th:field="*{confirmPassword}"
                               type="password" required minlength="8" placeholder="Re-enter password">
                        <button class="btn btn-outline-secondary toggle-password-btn" type="button" tabindex="-1" title="Show/Hide Password">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                    <div class="form-check mt-2">
                        <input class="form-check-input" type="checkbox" id="showPw">
                        <label class="form-check-label text-muted small" for="showPw">Show passwords</label>
                    </div>
                </div>

                <button class="btn btn-primary-custom w-100 py-2 mt-3" type="submit">
                    <i class="bi bi-check-circle-fill me-1"></i> Register &amp; Start Riding
                </button>
            </form>

            <div class="mt-4 pt-3 border-top text-center small text-muted">
                <p class="mb-2">Already have an account? <a th:href="@{/login}" class="fw-bold text-success text-decoration-none">Log in</a></p>
                <p class="mb-0">Want to drive with us? <a th:href="@{/driver/register}" class="fw-bold text-primary text-decoration-none">Register as Driver</a></p>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/js/validation.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
