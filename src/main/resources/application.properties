# Application Configuration
spring.application.name=taxi-booking-service
server.port=8080

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# File Storage Configuration (Data folder for text file persistence)
app.data.dir=data
app.data.passengers-file=data/passengers.txt
app.data.drivers-file=data/drivers.txt
app.data.vehicles-file=data/vehicles.txt
app.data.bookings-file=data/bookings.txt
app.data.payments-file=data/payments.txt
app.data.reviews-file=data/reviews.txt

# Logging
logging.level.com.taxibooking=INFO
